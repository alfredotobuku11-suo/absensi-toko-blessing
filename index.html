<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Blessing</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; }
        .header { background-color: #1a252f; color: white; width: 100%; text-align: center; padding: 18px 0; font-size: 22px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .app-container { width: 90%; max-width: 400px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 30px; display: flex; flex-direction: column; align-items: center; }
        
        #reader { width: 100%; border-radius: 10px; overflow: hidden; background-color: #000; }
        
        .btn { width: 100%; padding: 12px; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-kamera { background-color: #2c3e50; }
        .btn-sync { background-color: #e67e22; display: none; }
        
        #status-box { margin-top: 15px; padding: 12px; width: 100%; text-align: center; border-radius: 8px; font-weight: bold; display: none; box-sizing: border-box; }
        .sukses { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .offline { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
    <!-- Library QR Code Reader -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div class="header">Absensi Toko Blessing</div>
    <div class="app-container">
        <!-- Kamera akan muncul di sini tanpa embel-embel teks inggris -->
        <div id="reader"></div>
        <button id="btn-kamera" class="btn btn-kamera" onclick="mulaiKamera()">📸 Buka Kamera Scanner</button>
        
        <div id="status-box"></div>
        <button id="sync-btn" class="btn btn-sync" onclick="syncData()">⬆️ Kirim Data Offline</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
